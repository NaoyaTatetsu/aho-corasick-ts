name: Test

on:
  # No paths filter here on purpose: whatever a pull request skipped, the merged
  # state of main still gets verified. Restricting to main is what stops a branch
  # with an open pull request from running everything twice.
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths:
      - ".github/workflows/test.yml"
      - "benchmark/**"
      - "example/**"
      - "src/**"
      - "test/**"
      - "biome.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack

  # The package claims Node 18, but the test suite cannot run there: the runner's coverage
  # and type stripping need 22. This checks the claim on the versions the suite cannot reach.
  supported-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18.0.0', 18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Replace the toolchain's Node with the one under test, after the build is made.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node .github/scripts/smoke.mjs

  # Reports coverage back onto the pull request. Kept out of the matrix: one
  # measurement is the useful one, and three would be three comments.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure coverage
        run: |
          # Without pipefail, tee's success would hide a failing test run.
          set -o pipefail
          pnpm coverage | tee coverage.txt
      - name: Comment the report on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node .github/scripts/coverage-comment.mjs coverage.txt > comment.md
          # Update the previous report instead of stacking a new comment per push.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- coverage-report -->"))) | last | .id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md >/dev/null
            echo "updated comment $id"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md >/dev/null
            echo "created a new comment"
          fi
