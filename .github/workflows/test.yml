name: Test

on:
  # No paths filter here on purpose: whatever a pull request skipped, the merged
  # state of main still gets verified. Restricting to main is what stops a branch
  # with an open pull request from running everything twice.
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths:
      - ".github/workflows/test.yml"
      - "benchmark/**"
      - "src/**"
      - "test/**"
      - "biome.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack
