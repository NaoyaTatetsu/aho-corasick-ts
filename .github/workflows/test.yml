name: Test

on:
  # No paths filter here on purpose: whatever a pull request skipped, the merged
  # state of main still gets verified. Restricting to main is what stops a branch
  # with an open pull request from running everything twice.
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths:
      - ".github/workflows/test.yml"
      - "benchmark/**"
      - "src/**"
      - "test/**"
      - "biome.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack

  # Reports coverage back onto the pull request. Kept out of the matrix: one
  # measurement is the useful one, and three would be three comments.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage | tee coverage.txt
      - name: Comment the report on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The reporter prefixes every line, with '#' when piped and 'i' on a terminal.
          table=$(sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt \
            | sed -e 's/^# //' -e 's/^\xe2\x84\xb9 //' -e '/coverage report$/d')
          {
            echo '<!-- coverage-report -->'
            echo '### Coverage'
            echo
            echo '```'
            echo "$table"
            echo '```'
            echo
            echo "Measured on Node 24 against \`dist/index.js\`, the build the tests run against."
            echo "Line numbers are the compiled file's; \`pnpm coverage\` reproduces this locally."
          } > comment.md
          # Update the previous report instead of stacking a new comment per push.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- coverage-report -->"))) | last | .id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md >/dev/null
            echo "updated comment $id"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md >/dev/null
            echo "created a new comment"
          fi
