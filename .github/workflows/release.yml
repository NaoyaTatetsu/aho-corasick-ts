name: Release

# Publishing a GitHub Release is the deliberate act; this reacts to it.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm exchanges this for a short-lived credential, so no long-lived token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 carries npm 11.19, past the 11.5.1 that trusted publishing needs.
          # registry-url is deliberately unset: it writes an .npmrc expecting NODE_AUTH_TOKEN,
          # and there is no token here.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the release tag against package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag ${TAG} does not match package.json version ${version}." >&2
            exit 1
          fi
      # prepublishOnly runs lint, typecheck and tests, and prepack builds, so a broken
      # tree cannot reach the registry. Provenance is automatic under trusted publishing.
      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          # `published` fires for pre-releases too, and npm publish defaults to the `latest`
          # dist-tag, which would hand every `npm install` a beta. Pre-releases go to `next`.
          if [ "${PRERELEASE}" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
