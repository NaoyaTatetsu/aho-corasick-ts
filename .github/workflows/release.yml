name: Release

# Merging a version bump is what releases. The gate below decides whether this
# particular push is one, so ordinary merges cost a few seconds and stop there.
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Creating the tag and the release.
      contents: write
      # npm exchanges this for a short-lived credential, so no long-lived token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          # Node 24 carries npm 11.19, past the 11.5.1 that trusted publishing needs.
          # registry-url is deliberately unset: it writes an .npmrc expecting NODE_AUTH_TOKEN,
          # and there is no token here.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Refuses a version that went backwards, skipped a step, or has no changelog entry,
      # and stays quiet when the version is one the registry already has.
      - id: gate
        run: node .github/scripts/check-release.mjs
      # prepublishOnly runs lint, typecheck and tests, and prepack builds, so a broken
      # tree cannot reach the registry. Provenance is automatic under trusted publishing.
      - name: Publish
        if: steps.gate.outputs.publish == 'true'
        env:
          PRERELEASE: ${{ steps.gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          # npm publish defaults to the `latest` dist-tag, which would hand every
          # `npm install` a beta. Prereleases go to `next`.
          if [ "${PRERELEASE}" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
      # The tag is what ties a published version to the commit it came from.
      - name: Tag and announce
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
          NOTES: ${{ steps.gate.outputs.notes }}
          PRERELEASE: ${{ steps.gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NOTES}" > notes.md
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file notes.md \
            $([ "${PRERELEASE}" = "true" ] && echo --prerelease || true)
